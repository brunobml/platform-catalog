apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: testreportviewer
spec:
  schema:
    apiVersion: v1alpha1
    kind: TestReportViewer
    spec:
      bucketName: string
      replicas: integer
      image: string
      ingressHost: string
      resultsRepoUrl: string
    status:
      bucketName: ${bucket.spec.name}
      bucketARN: ${bucket.status.ackResourceMetadata.arn}
      dashboardURL: http://${schema.spec.ingressHost}:8081

  resources:
    - id: platformconfig
      externalRef:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: platform-config
          namespace: kube-system

    - id: bucket
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${schema.spec.bucketName}
          annotations:
            services.k8s.aws/deletion-policy: retain
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          name: ${schema.spec.bucketName}

    - id: serviceaccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.metadata.name}
          labels:
            app.kubernetes.io/name: bats-test-reporter
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/part-of: platform-reports
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        automountServiceAccountToken: false

    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}
          labels:
            app.kubernetes.io/name: bats-test-reporter
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/part-of: platform-reports
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          selector:
            app.kubernetes.io/name: bats-test-reporter
            app.kubernetes.io/instance: ${schema.metadata.name}
          ports:
            - name: http
              port: 8080
              targetPort: 8080

    - id: ingress
      template:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${schema.metadata.name}
          labels:
            app.kubernetes.io/name: bats-test-reporter
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/part-of: platform-reports
          annotations:
            argocd.argoproj.io/ignore-default-links: "true"
            link.argocd.argoproj.io/external-link: '${"http://" + schema.spec.ingressHost + ":" + platformconfig.data.INGRESS_PORT}'
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          ingressClassName: traefik
          rules:
            - host: ${schema.spec.ingressHost}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${schema.metadata.name}
                        port:
                          number: 8080

    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
          labels:
            app.kubernetes.io/name: bats-test-reporter
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/part-of: platform-reports
            app.kubernetes.io/component: dashboard
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app.kubernetes.io/name: bats-test-reporter
              app.kubernetes.io/instance: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app.kubernetes.io/name: bats-test-reporter
                app.kubernetes.io/instance: ${schema.metadata.name}
                app.kubernetes.io/part-of: platform-reports
                app.kubernetes.io/component: dashboard
            spec:
              serviceAccountName: ${schema.metadata.name}
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: reporter
                  image: ${schema.spec.image}
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop:
                        - ALL
                  env:
                    - name: S3_ENDPOINT_URL
                      value: "http://moto-cloud:5000"
                    - name: S3_BUCKET_NAME
                      value: ${schema.spec.bucketName}
                    - name: GIT_REPO_URL
                      value: ${schema.spec.resultsRepoUrl}
                    - name: GIT_CACHE_DIR
                      value: "/tmp/git-cache"
                  ports:
                    - containerPort: 8080
                      name: http
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi
                  livenessProbe:
                    httpGet:
                      path: /healthz
                      port: http
                    initialDelaySeconds: 5
                    periodSeconds: 15
                    timeoutSeconds: 3
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /healthz
                      port: http
                    initialDelaySeconds: 5
                    periodSeconds: 10
                    timeoutSeconds: 3
                    failureThreshold: 2
                  volumeMounts:
                    - name: tmp
                      mountPath: /tmp
              volumes:
                - name: tmp
                  emptyDir: {}

    - id: networkpolicy
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${schema.metadata.name}-netpol
          labels:
            app.kubernetes.io/name: bats-test-reporter
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/part-of: platform-reports
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bats-test-reporter
              app.kubernetes.io/instance: ${schema.metadata.name}
          policyTypes:
            - Ingress
            - Egress
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik
                - podSelector: {}
              ports:
                - protocol: TCP
                  port: 8080
          egress:
            # DNS
            - to:
                - namespaceSelector: {}
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - protocol: UDP
                  port: 53
                - protocol: TCP
                  port: 53
            # Moto Cloud
            - to:
                - ipBlock:
                    cidr: 172.21.0.0/16
              ports:
                - protocol: TCP
                  port: 5000
            # GitHub HTTPS
            - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
              ports:
                - protocol: TCP
                  port: 443
