# Phase 3 C.3 (L4-5): the permissions kro needs to reconcile QueueBackedService instances.
# Aggregated into kro's controller role only when kro runs with rbac.mode=aggregation;
# inert while kro is unrestricted. Versioned with the RGD so blueprint and permissions
# are promoted together.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro-queue-backed-service
  labels:
    rbac.kro.run/aggregate-to-controller: "true"
rules:
  - apiGroups: ["sqs.services.k8s.aws"]
    resources: ["queues"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
