apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: queuebackedservice
spec:
  schema:
    apiVersion: v1alpha1
    kind: QueueBackedService
    spec:
      # Phase 3 D.5 (L2-5): validated contract; invalid instances are rejected by the API server.
      name: string | required=true
      environment: string | enum="dev,test,prod" required=true
      replicas: integer | default=1 minimum=1 maximum=10
      messageRetentionPeriod: string | default="345600"
      image: string | required=true
    status:
      queueURL: ${queue.status.queueURL}
      queueARN: ${queue.status.ackResourceMetadata.arn}
      dlqURL: ${dlq.status.queueURL}
      dlqARN: ${dlq.status.ackResourceMetadata.arn}
      serviceURL: http://${service.metadata.name}.${schema.metadata.namespace}.svc.cluster.local
      environment: ${schema.spec.environment}
  resources:
    # Phase 3 D.5 (L2-6): per-cluster facts (moto endpoint, ingress port) come from
    # kube-system/platform-config, managed by gitops-control-plane, not hard-coded here.
    - id: platformconfig
      externalRef:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: platform-config
          namespace: kube-system

    - id: dlq
      template:
        apiVersion: sqs.services.k8s.aws/v1alpha1
        kind: Queue
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}-dlq
          annotations:
            # Phase 3 D.4 (L3-9): deleting a prod instance must not delete its queues.
            services.k8s.aws/deletion-policy: '${schema.spec.environment == "prod" ? "retain" : "delete"}'
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          queueName: ${schema.spec.name}-${schema.spec.environment}-dlq
          delaySeconds: "0"
          messageRetentionPeriod: "1209600"

    - id: queue
      template:
        apiVersion: sqs.services.k8s.aws/v1alpha1
        kind: Queue
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}-queue
          annotations:
            # Phase 3 D.4 (L3-9): deleting a prod instance must not delete its queues.
            services.k8s.aws/deletion-policy: '${schema.spec.environment == "prod" ? "retain" : "delete"}'
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          queueName: ${schema.spec.name}-${schema.spec.environment}-queue
          delaySeconds: "0"
          messageRetentionPeriod: ${schema.spec.messageRetentionPeriod}
          redrivePolicy: '{"deadLetterTargetArn":"${dlq.status.ackResourceMetadata.arn}","maxReceiveCount":5}'

    - id: config
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}-config
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        data:
          QUEUE_URL: ${queue.status.queueURL}
          QUEUE_ARN: ${queue.status.ackResourceMetadata.arn}
          DLQ_URL: ${dlq.status.queueURL}
          DLQ_ARN: ${dlq.status.ackResourceMetadata.arn}
          ENVIRONMENT: ${schema.spec.environment}
          APP_NAME: ${schema.spec.name}
          MOTO_ENDPOINT: ${platformconfig.data.MOTO_ENDPOINT}

    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}
          labels:
            app: ${schema.spec.name}-${schema.spec.environment}-worker
            environment: ${schema.spec.environment}
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          ports:
            - port: 80
              targetPort: 8080
              name: http
          selector:
            app: ${schema.spec.name}-${schema.spec.environment}-worker

    - id: ingress
      template:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}
          labels:
            app: ${schema.spec.name}-${schema.spec.environment}-worker
            environment: ${schema.spec.environment}
          annotations:
            argocd.argoproj.io/ignore-default-links: "true"
            link.argocd.argoproj.io/external-link: '${"http://" + schema.spec.name + "-" + schema.spec.environment + ".localhost:" + platformconfig.data.INGRESS_PORT}'
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          ingressClassName: traefik
          rules:
            - host: ${schema.spec.name}-${schema.spec.environment}.localhost
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${schema.spec.name}-${schema.spec.environment}
                        port:
                          number: 80

    - id: serviceaccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}-sa
          labels:
            app: ${schema.spec.name}-${schema.spec.environment}-worker
            environment: ${schema.spec.environment}
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        automountServiceAccountToken: false

    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}-worker
          labels:
            app: ${schema.spec.name}-${schema.spec.environment}-worker
            environment: ${schema.spec.environment}
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: ${schema.spec.name}-${schema.spec.environment}-worker
          template:
            metadata:
              labels:
                app: ${schema.spec.name}-${schema.spec.environment}-worker
                environment: ${schema.spec.environment}
            spec:
              serviceAccountName: ${serviceaccount.metadata.name}
              automountServiceAccountToken: false
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                fsGroup: 10001
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: app
                  image: ${schema.spec.image}
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop:
                        - ALL
                  volumeMounts:
                    - name: tmp
                      mountPath: /tmp
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 200m
                      memory: 128Mi
                  livenessProbe:
                    httpGet:
                      path: /healthz
                      port: 8080
                    initialDelaySeconds: 10
                    periodSeconds: 15
                    timeoutSeconds: 3
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /healthz
                      port: 8080
                    initialDelaySeconds: 5
                    periodSeconds: 10
                    timeoutSeconds: 2
                    failureThreshold: 2
                  ports:
                    - containerPort: 8080
                      name: http
                  # Phase 3 D.1: per-environment cloud credentials (local stand-in for
                  # IRSA / Pod Identity). optional, so absent Secret = unchanged behaviour.
                  envFrom:
                    - secretRef:
                        name: ${schema.spec.name}-${schema.spec.environment}-aws
                        optional: true
                  env:
                    - name: PYTHONDONTWRITEBYTECODE
                      value: "1"
                    - name: QUEUE_URL
                      valueFrom:
                        configMapKeyRef:
                          name: ${schema.spec.name}-${schema.spec.environment}-config
                          key: QUEUE_URL
                    - name: QUEUE_ARN
                      valueFrom:
                        configMapKeyRef:
                          name: ${schema.spec.name}-${schema.spec.environment}-config
                          key: QUEUE_ARN
                    - name: DLQ_URL
                      valueFrom:
                        configMapKeyRef:
                          name: ${schema.spec.name}-${schema.spec.environment}-config
                          key: DLQ_URL
                    - name: ENVIRONMENT
                      valueFrom:
                        configMapKeyRef:
                          name: ${schema.spec.name}-${schema.spec.environment}-config
                          key: ENVIRONMENT
                    - name: APP_NAME
                      valueFrom:
                        configMapKeyRef:
                          name: ${schema.spec.name}-${schema.spec.environment}-config
                          key: APP_NAME
                    - name: MOTO_ENDPOINT
                      valueFrom:
                        configMapKeyRef:
                          name: ${schema.spec.name}-${schema.spec.environment}-config
                          key: MOTO_ENDPOINT
              volumes:
                - name: tmp
                  emptyDir: {}

    - id: pdb
      includeWhen:
        - ${schema.spec.replicas > 1}
      template:
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}-pdb
          labels:
            app: ${schema.spec.name}-${schema.spec.environment}-worker
            environment: ${schema.spec.environment}
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          minAvailable: 1
          selector:
            matchLabels:
              app: ${schema.spec.name}-${schema.spec.environment}-worker

    - id: networkpolicy
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}-netpol
          labels:
            app: ${schema.spec.name}-${schema.spec.environment}-worker
            environment: ${schema.spec.environment}
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          podSelector:
            matchLabels:
              app: ${schema.spec.name}-${schema.spec.environment}-worker
          policyTypes:
            - Ingress
            - Egress
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik
                - podSelector: {}
              ports:
                - protocol: TCP
                  port: 8080
          egress:
            - to:
                - namespaceSelector: {}
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - protocol: UDP
                  port: 53
                - protocol: TCP
                  port: 53
            - to:
                - ipBlock:
                    cidr: 172.21.0.0/16
              ports:
                - protocol: TCP
                  port: 5000

    # Phase 3 C.4 (PV2-2): namespace-wide default deny. Any pod in the instance namespace
    # that no other policy allows gets DNS only. The worker keeps its own allow-list
    # (networkpolicy above); NetworkPolicies are additive.
    - id: nsdefaultdeny
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${schema.spec.name}-${schema.spec.environment}-ns-default-deny
          labels:
            environment: ${schema.spec.environment}
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              controller: true
              blockOwnerDeletion: true
        spec:
          podSelector: {}
          policyTypes:
            - Ingress
            - Egress
          egress:
            - to:
                - namespaceSelector: {}
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - protocol: UDP
                  port: 53
                - protocol: TCP
                  port: 53
